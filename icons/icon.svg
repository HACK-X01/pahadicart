
  <!DOCTYPE html>
  <html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background: #040813;
      }
      .icon-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 20%, #059669 0%, #064e3b 40%, #022c22 80%, #040813 100%);
        border-radius: 22%;
        position: relative;
        overflow: hidden;
      }
      .mountain-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 60%, rgba(16, 185, 129, 0.45) 0%, transparent 60%);
      }
      svg {
        width: 78%;
        height: 78%;
        filter: drop-shadow(0 14px 28px rgba(0,0,0,0.6));
      }
    </style>
  </head>
  <body>
    <div class="icon-container">
      <div class="mountain-glow"></div>
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Mountain Peak 1 (Left Ridge) -->
        <polygon points="15,160 75,55 130,160" fill="url(#gradPeakLeft)" />
        <polygon points="75,55 55,95 75,100 88,80 96,105 130,160 15,160" fill="url(#gradPeakShadow)" opacity="0.4" />
        <polygon points="75,55 60,85 75,90 90,75" fill="#ffffff" />
        
        <!-- Mountain Peak 2 (Highest Center Peak) -->
        <polygon points="65,165 125,30 185,165" fill="url(#gradPeakCenter)" />
        <polygon points="125,30 102,75 125,82 142,65 152,90 185,165 65,165" fill="url(#gradPeakDark)" opacity="0.45" />
        <polygon points="125,30 106,68 125,74 140,58" fill="#ffffff" />
        
        <!-- Glowing Delivery Lightning Pin -->
        <circle cx="155" cy="55" r="28" fill="#047857" opacity="0.8" />
        <circle cx="155" cy="55" r="22" fill="#10b981" />
        <path d="M156 39L143 54H155L153 71L169 52H156L156 39Z" fill="#facc15" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))" />

        <!-- Mountain Road Curve -->
        <path d="M20 170 C 65 140, 110 185, 180 155" stroke="#34d399" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9" />
        <path d="M30 170 C 70 145, 110 182, 170 156" stroke="#facc15" stroke-width="2.5" stroke-dasharray="6,6" stroke-linecap="round" fill="none" />

        <defs>
          <linearGradient id="gradPeakLeft" x1="15" y1="55" x2="130" y2="160" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#34d399" />
            <stop offset="100%" stop-color="#065f46" />
          </linearGradient>
          <linearGradient id="gradPeakCenter" x1="65" y1="30" x2="185" y2="165" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6ee7b7" />
            <stop offset="50%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#044e3b" />
          </linearGradient>
          <linearGradient id="gradPeakShadow" x1="50" y1="60" x2="120" y2="150" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#022c22" />
            <stop offset="100%" stop-color="#011812" />
          </linearGradient>
          <linearGradient id="gradPeakDark" x1="100" y1="40" x2="180" y2="160" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#03261d" />
            <stop offset="100%" stop-color="#021711" />
          </linearGradient>
        </defs>
      </svg>
    </div>
  </body>
  </html>
  