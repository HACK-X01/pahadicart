<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Immediate pre-render cache purge to ensure fresh styles and zero stale stats
    if ('caches' in window && localStorage.getItem('pahadi_v10_purge') !== 'true') {
      caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))));
      localStorage.removeItem('pahadicart_cart_data');
      localStorage.removeItem('pahadicart_orders_db');
      localStorage.removeItem('pahadicart_products');
      localStorage.setItem('pahadi_v10_purge', 'true');
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (let reg of regs) reg.update();
        });
      }
    }
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PahadiCart Rider Cockpit — Mountain Delivery Partner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css?v=3.3.0" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="css/rider.css?v=3.3.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  

  <!-- PWA Headers -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PahadiCart">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/favicon.png">
</head>
<body>

  <!-- Mobile App Header -->
  <header class="rider-top-bar">
    <div class="rider-info">
      <div class="rider-avatar">🛵</div>
      <div>
        <div class="rider-name">Rider Partner</div>
        <div class="rider-bike">Duty Vehicle (Pilot HP-14) • Solan</div>
      </div>
    </div>

    <button onclick="window.showBatchedRouteModal()" style="background:linear-gradient(135deg, #10b981, #047857); color:#fff; border:none; padding:7px 13px; border-radius:20px; font-size:12px; font-weight:800; cursor:pointer; margin-right:8px;">📦 Batched Route</button>
    <!-- Duty Status Switch -->
    <button class="duty-toggle" id="dutyToggleBtn" onclick="window.riderApp.toggleDuty()">
      <span>🟢 Online (On Duty)</span>
    </button>

    <!-- Direct Header Logout Button -->
    <button class="header-logout-btn" onclick="window.pahadiLogout()" style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 7px 13px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; margin-left: 8px;" title="Logout from Rider Cockpit">
      <span>🚪</span>
      <span>Logout</span>
    </button>
  </header>

  <!-- Telemetry & Floating Cash Bar -->
  <section class="telemetry-deck">
    <div class="stat-box">
      <div class="stat-lbl">AAJ KI KAMAI (EARNINGS)</div>
      <div class="stat-val" id="todayEarnings">₹0</div>
      <div class="stat-hint">0 Deliveries Completed</div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">COD FLOATING CASH</div>
      <div class="stat-val" id="cashBalance">₹0</div>
      <div class="stat-hint" style="color: #fbbf24;">Safe (&lt; ₹2,500 Limit)</div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">ALTITUDE CLIMBED</div>
      <div class="stat-val" id="altitudeClimbed">0 m</div>
      <div class="stat-hint">₹0 Mountain Bonus</div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">BATTERY & SIGNAL</div>
      <div class="stat-val" style="color: #10b981;">88% • 4G</div>
      <div class="stat-hint">GPS Precision: 3 meters</div>
    </div>
  </section>

  <!-- Emergency SOS Breakdown -->
  <div class="sos-strip">
    <button class="sos-btn" onclick="window.riderApp.triggerSOS()">
      <span>🚨</span>
      <span>EMERGENCY SOS: Hill Breakdown / Landslide Alert</span>
    </button>
  </div>

  <!-- Cockpit Main Area -->
  <main class="cockpit-view">
    <!-- Active Delivery Mission (If order picked) -->
    <div id="activeMissionContainer" style="display: none;">
      <!-- Injected by JS -->
    </div>

    <!-- Incoming Dispatch Radar (When an order is available) -->
    <div id="incomingRadarContainer">
      <!-- Injected by JS -->
    </div>
  </main>

  <!-- Shared Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/shared/hillAudio.js?v=3.3.0"></script>
  <script src="/shared/pushNotifier.js"></script>
  <script src="/shared/sharedData.js?v=3.3.0"></script>
  <script src="/shared/eventBus.js?v=3.3.0"></script>
  <!-- Rider Controller -->
  <script src="/shared/liveServices.js?v=3.3.0"></script>
  <script src="/shared/batchingEngine.js?v=3.3.0"></script>
  <script src="js/riderApp.js?v=3.3.0"></script>
<script src="/shared/pwaInit.js"></script>
  <script src="/shared/mockApi.js"></script>
  <script src="/shared/profileSidebar.js"></script>
</body>
</html>
