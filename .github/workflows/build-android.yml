name: Build Android APK and Google Play AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.5

      - name: Make Gradlew Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release Bundle (AAB for Google Play Store)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PahadiCart-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Deploy APK to Repository Root for Direct Download
        run: |
          if ls android/app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/debug/*.apk PahadiCart.apk
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add PahadiCart.apk
            git commit -m "chore(apk): update prebuilt PahadiCart.apk [skip ci]" || echo "No changes"
            git push origin main || echo "Push failed"
          fi
